[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arara-rag"
version = "0.4.0"
description = "Portuguese-first, CPU-only retrieval: tinyzchunk chunking, static embeddings, BM25, rank fusion and CXM25 reranking. numpy only, out-of-core, with metadata filtering and CRUD."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Carlo Moro" }]
keywords = ["rag", "retrieval", "portuguese", "pt-br", "embeddings", "bm25", "cpu", "numpy", "out-of-core"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.23",
  "tokenizers>=0.20",
  "model2vec>=0.9",
  "tinyzchunk>=0.3.3",
  "cxm25>=0.1.0",
  # Index build is per-document and runs in a process pool. Without a thread
  # cap, OpenBLAS gives every worker a full thread team and the oversubscription
  # costs ~4x on the chunking matmuls.
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
# The benchmark harness is the only thing that needs the heavy stack.
bench = ["datasets>=2.19", "pyarrow", "huggingface_hub>=0.23", "matplotlib>=3.8"]
validate = ["pytrec_eval-terrier>=0.5.6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/cnmoro/Arara-RAG"
Repository = "https://github.com/cnmoro/Arara-RAG"

[tool.setuptools]
packages = ["arara_rag"]

[tool.setuptools.package-data]
arara_rag = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
