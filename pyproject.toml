[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arara-rag"
version = "0.1.0"
description = "Portuguese-first, CPU-only RAG retrieval: chunking, static embeddings, hybrid search and lexical reranking with numpy and no PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Carlo Moro" }]
keywords = ["rag", "retrieval", "portuguese", "pt-br", "embeddings", "bm25", "cpu", "numpy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.23",
  "tokenizers>=0.20",
  "model2vec>=0.9",
  "tinyzchunk>=0.3.0",
  "cxm25>=0.1.0",
]

[project.optional-dependencies]
# The benchmark harness is the only thing that needs the heavy stack.
bench = ["datasets>=2.19", "pyarrow", "huggingface_hub>=0.23"]
validate = ["pytrec_eval-terrier>=0.5.6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/cnmoro/arara-rag"
Repository = "https://github.com/cnmoro/arara-rag"

[tool.setuptools]
packages = ["arara_rag"]

[tool.setuptools.package-data]
arara_rag = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
